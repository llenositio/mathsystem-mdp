<!-- Modal del Chat con el Profe -->
<div id="modalChat" class="modal-overlay" style="display:none;">

      <p style="color:#777; text-align:center;">Acá aparecerán los mensajes del chat...</p>
    </div>
    <textarea id="chatInput" placeholder="Escribí tu pregunta..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; min-height:60px; box-sizing:border-box;"></textarea>
    
    <!-- Botones de símbolos matemáticos -->
    <div id="math-buttons">
      <button type="button" class="btn-math" onclick="insertarSimbolo('raiz_cuadrada')">√</button>
      <button type="button" class="btn-math" onclick="insertarSimbolo('raiz_enesima')">n√</button>
      <button type="button" class="btn-math" onclick="insertarSimbolo('potencia')">x^n</button>
      <button type="button" class="btn-math" onclick="insertarSimbolo('fraccion')">a/b</button>
      <button type="button" class="btn-math" onclick="insertarSimbolo('parentesis')">( )</button>
      <div class="math-row">
        <button type="button" class="btn-math" onclick="insertarSimbolo('integral')">∫</button>
        <button type="button" class="btn-math" onclick="insertarSimbolo('derivada')">f'</button>
        <button type="button" class="btn-math" onclick="insertarSimbolo('limite')">lim</button>
        <button type="button" class="btn-math" onclick="insertarSimbolo('infinito')">&infin;</button>
        <button type="button" class="btn-math" onclick="insertarSimbolo('multiplicacion')">*</button>
      </div>
      <div class="math-row">
        <button type="button" class="btn-math" onclick="insertarSimbolo('matriz')">[[ ]]</button>
        <button type="button" class="btn-math" onclick="insertarSimbolo('sistema')">{ }</button>
      </div>
    </div>
    <button onclick="enviarMensajeChat()" class="btn-principal" style="margin-top:10px; padding:10px;">Enviar</button>
  </div>
</div>

<!-- RASTREADOR DE CAMBIO DE PESTAÑA Y PANTALLA DIVIDIDA (FOCUS/BLUR) -->
<script>
  window.contadorFugas = 0;
  window.detalleFugas = [];
  var tiempoSalida = null;

  function registrarSalida() {
    if (!tiempoSalida) {
      window.contadorFugas++;
      tiempoSalida = new Date();
    }
  }

  function registrarRegreso() {
    if (tiempoSalida) {
      var tiempoFueraSeg = Math.round((new Date() - tiempoSalida) / 1000);
      var horaSalida = tiempoSalida.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (tiempoFueraSeg >= 2) {
        window.detalleFugas.push("Salió " + tiempoFueraSeg + " seg (a las " + horaSalida + ")");
      } else {
        window.contadorFugas--;
      }
      tiempoSalida = null;
    }
  }

  document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
      registrarSalida();
    } else {
      registrarRegreso();
    }
  });

  window.addEventListener("blur", function() {
    registrarSalida();
  });

  window.addEventListener("focus", function() {
    registrarRegreso();
  });

  function obtenerReporteFugas() {
    if (window.contadorFugas <= 0 || window.detalleFugas.length === 0) {
      return "Sin salidas de pantalla";
    }
    return "Fugas: " + window.detalleFugas.length + " vez/veces | Detalle: " + window.detalleFugas.join(" | ");
  }
</script>
