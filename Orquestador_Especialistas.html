<script>
  /**
   * Obtiene la función renderizadora para un tipo de pregunta.
   */
  function obtenerRenderizadorEspecialista(tipo) {
    const mapa = {
      'OM': typeof renderizarEspecialista_OM === 'function' ? renderizarEspecialista_OM : null,
      'VF': typeof renderizarEspecialista_VF === 'function' ? renderizarEspecialista_VF : null,
      'CA': typeof renderizarEspecialista_CA === 'function' ? renderizarEspecialista_CA : null,
      'BALANZA': typeof renderizarEspecialista_Balanza === 'function' ? renderizarEspecialista_Balanza : null,
      'RM': typeof renderizarEspecialista_RM === 'function' ? renderizarEspecialista_RM : null,
      'VI': typeof renderizarEspecialista_VI === 'function' ? renderizarEspecialista_VI : null,
      'CV': typeof renderizarEspecialista_CV === 'function' ? renderizarEspecialista_CV : null,
      'EM': typeof renderizarEspecialista_EM === 'function' ? renderizarEspecialista_EM : null,
      'PC1': typeof renderizarEspecialista_PC1 === 'function' ? renderizarEspecialista_PC1 : null,
      'FR1': typeof renderizarEspecialista_FR1 === 'function' ? renderizarEspecialista_FR1 : null,
      'EXAMEN': typeof renderizarEspecialista_EXAMEN === 'function' ? renderizarEspecialista_EXAMEN : null
    };

    return mapa[tipo] || null;
  }

  /**
   * Enrutador principal: toma un objeto de pregunta y genera su HTML.
   */
  function renderizarPregunta(pregunta, indice) {
    if (!pregunta || !pregunta.tipo) {
      return `
        <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl my-3 text-rose-700 text-xs font-semibold">
          ❌ Error: Pregunta no válida o sin tipo definido en la posición ${indice}.
        </div>
      `;
    }

    const tipo = String(pregunta.tipo).toUpperCase().trim();
    const renderizador = obtenerRenderizadorEspecialista(tipo);

    if (renderizador) {
      try {
        return renderizador(pregunta, indice);
      } catch (err) {
        console.error(`Error renderizando especialista ${tipo}:`, err);
        return `
          <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl my-3 text-rose-700 text-xs">
            ❌ Ocurrió un error al renderizar la pregunta de tipo <strong>${tipo}</strong>.
          </div>
        `;
      }
    }

    return `
      <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl my-3 text-amber-800 text-xs">
        ⚠️ Especialista no configurado o no cargado para el tipo: <strong>${tipo}</strong>
      </div>
    `;
  }

  /**
   * Hook Post-Renderizado
   */
  function inicializarEspecialistasPostRender(preguntas) {
    if (!Array.isArray(preguntas)) return;

    preguntas.forEach((pregunta, indice) => {
      if (!pregunta || !pregunta.tipo) return;

      const tipo = String(pregunta.tipo).toUpperCase().trim();
      const idPregunta = (pregunta.id !== undefined && pregunta.id !== null) 
        ? pregunta.id 
        : `pre_${tipo.toLowerCase()}_${indice}`;

      switch (tipo) {
        case 'PC1':
          if (typeof inicializarCanvasPC1 === 'function') {
            inicializarCanvasPC1(idPregunta);
          }
          break;
        default:
          break;
      }
    });
  }
</script>
