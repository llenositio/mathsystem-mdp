<!-- RASTREADOR DE CAMBIO DE PESTAÑA Y PANTALLA DIVIDIDA (FOCUS/BLUR) -->
<script>
  window.contadorFugas = 0;
  window.detalleFugas = [];
  var tiempoSalida = null;

  function registrarSalida() {
    if (!tiempoSalida) {
      window.contadorFugas++;
      tiempoSalida = new Date();
    }
  }

  function registrarRegreso() {
    if (tiempoSalida) {
      var tiempoFueraSeg = Math.round((new Date() - tiempoSalida) / 1000);
      var horaSalida = tiempoSalida.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (tiempoFueraSeg >= 2) {
        window.detalleFugas.push("Salió " + tiempoFueraSeg + " seg (a las " + horaSalida + ")");
      } else {
        window.contadorFugas--;
      }
      tiempoSalida = null;
    }
  }

  document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
      registrarSalida();
    } else {
      registrarRegreso();
    }
  });

  window.addEventListener("blur", function() {
    registrarSalida();
  });

  window.addEventListener("focus", function() {
    registrarRegreso();
  });

  function obtenerReporteFugas() {
    if (window.contadorFugas <= 0 || window.detalleFugas.length === 0) {
      return "Sin salidas de pantalla";
    }
    return "Fugas: " + window.detalleFugas.length + " vez/veces | Detalle: " + window.detalleFugas.join(" | ");
  }
</script>
